name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          # Keep the runner's own Node (this workflow never pinned one) and let
          # Vite+ manage the package manager declared in package.json.
          node-manager: false
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check (format, lint, types)
        run: vp check

      # The 100% coverage gate: fails on any threshold shortfall.
      # `vp exec vitest`, not `vp test --coverage`: vite-plus 0.1.24 leaves
      # coverageFilesDirectory unset there and every threshold reads 0%.
      - name: Test with coverage
        run: vp exec vitest run --coverage

      # Typecheck cannot catch a peer-only runtime dependency: the dev tree
      # always resolves it. This packs the real tarball, installs it clean,
      # and imports both entrypoints under Bun (the TUI loader's runtime).
      - name: Runtime host-compat probe
        run: node scripts/host-compat.mjs .
